<text x="36" y="31" font-size="13" font-weight="700" text-anchor="start" fill="#4c6573"><tspan x="36" dy="0">iEWR 7.0.8  /  ARCHIMATE  /  A-0</tspan></text>
<text x="36" y="64" font-size="26" font-weight="720" text-anchor="start" fill="#172d38"><tspan x="36" dy="0">Граница iEWR</tspan></text>
<text x="523" y="270" font-size="13" font-weight="720" text-anchor="start" fill="#4a7087"><tspan x="523" dy="0">iEWR</tspan></text>
<text x="523" y="295" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="523" dy="0">Организовать инженерную работу</tspan><tspan x="523" dy="21">и получить пригодный результат</tspan></text>
<text x="59" y="184.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="59" dy="0">Поручение, ответы и мандат</tspan></text>
<text x="59" y="423.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="59" dy="0">Результат, вывод или вопрос</tspan><tspan x="59" dy="21">для человека</tspan></text>
<text x="1085" y="140.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="1085" dy="0">Исходные и справочные</tspan><tspan x="1085" dy="21">материалы проекта</tspan></text>
<text x="567" y="140.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="567" dy="0">Сохранённые основания</tspan><tspan x="567" dy="21">для продолжения</tspan></text>
<text x="1085" y="256.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="1085" dy="0">Правила iEWR и оригинал FPF</tspan></text>
<text x="1085" y="362.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="1085" dy="0">MethodPack</tspan></text>
<text x="1085" y="468.0" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="1085" dy="0">Журнал применения методов</tspan></text>
<text x="447" y="500" font-size="13" font-weight="720" text-anchor="start" fill="#866a46"><tspan x="447" dy="0">ИСПОЛНИТЕЛЬ</tspan></text>
<text x="447" y="535" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="447" dy="0">Агент</tspan></text>
<text x="744" y="500" font-size="13" font-weight="720" text-anchor="start" fill="#4a7087"><tspan x="744" dy="0">СРЕДСТВА ADE</tspan></text>
<text x="744" y="535" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="744" dy="0">Инструменты и доступ</tspan></text>
<text x="53" y="589" font-size="14" font-weight="510" text-anchor="start" fill="#4c6573"><tspan x="53" dy="0">Агент действует в пределах мандата, правил и ограничений ADE. Изменение оригиналов требует отдельного указания.</tspan><tspan x="53" dy="22">Журнал пополняется при фактическом применении FPF или MP. MethodPack обновляется по необходимости.</tspan></text>
