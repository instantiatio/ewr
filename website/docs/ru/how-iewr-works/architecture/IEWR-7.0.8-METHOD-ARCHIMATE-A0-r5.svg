<text x="36" y="31" font-size="13" font-weight="700" text-anchor="start" fill="#4c6573"><tspan x="36" dy="0">iEWR 7.0.8  /  ARCHIMATE  /  A0</tspan></text>
<text x="36" y="64" font-size="26" font-weight="720" text-anchor="start" fill="#172d38"><tspan x="36" dy="0">Как связаны функции iEWR</tspan></text>
<text x="57" y="282" font-size="13" font-weight="720" text-anchor="start" fill="#4a7087"><tspan x="57" dy="0">A1 · HI, CF, SF</tspan></text>
<text x="57" y="307" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="57" dy="0">Определить основания</tspan><tspan x="57" dy="21">и нужный вклад</tspan></text>
<text x="348" y="282" font-size="13" font-weight="720" text-anchor="start" fill="#567a63"><tspan x="348" dy="0">A2 · DMG</tspan></text>
<text x="348" y="307" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="348" dy="0">Получить</tspan><tspan x="348" dy="21">пригодный способ</tspan></text>
<text x="639" y="282" font-size="13" font-weight="720" text-anchor="start" fill="#866a46"><tspan x="639" dy="0">A3 · EG</tspan></text>
<text x="639" y="307" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="639" dy="0">Проверить допуск</tspan><tspan x="639" dy="21">к действию</tspan></text>
<text x="930" y="282" font-size="13" font-weight="720" text-anchor="start" fill="#4a7087"><tspan x="930" dy="0">A4 · WEC</tspan></text>
<text x="930" y="307" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="930" dy="0">Выполнить</tspan><tspan x="930" dy="21">допущенную работу</tspan></text>
<text x="1221" y="282" font-size="13" font-weight="720" text-anchor="start" fill="#4a7087"><tspan x="1221" dy="0">A5 · RAF</tspan></text>
<text x="1221" y="307" font-size="16" font-weight="650" text-anchor="start" fill="#172d38"><tspan x="1221" dy="0">Оценить пригодность</tspan><tspan x="1221" dy="21">результата</tspan></text>
<text x="297" y="257" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="297" dy="0">J03</tspan><tspan x="297" dy="16">Вклад</tspan><tspan x="297" dy="16">и условия</tspan></text>
<text x="588" y="257" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="588" dy="0">J04</tspan><tspan x="588" dy="16">Способ</tspan><tspan x="588" dy="16">и условия</tspan></text>
<text x="879" y="273" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="879" dy="0">J05</tspan><tspan x="879" dy="16">Допуск</tspan></text>
<text x="1170" y="257" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="1170" dy="0">J06</tspan><tspan x="1170" dy="16">Результат</tspan><tspan x="1170" dy="16">попытки</tspan></text>
<text x="1005" y="101" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="1005" dy="0">J03 · Критерий пригодности</tspan></text>
<text x="400" y="137" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="400" dy="0">J01 · Поручение и решения</tspan></text>
<text x="802" y="171" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="802" dy="0">J04 · Способ и условия</tspan></text>
<text x="1183" y="394" font-size="13" font-weight="600" text-anchor="middle" fill="#8a522b" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="1183" dy="0">Пересмотр выполнения</tspan></text>
<text x="756" y="434" font-size="13" font-weight="600" text-anchor="middle" fill="#8a522b" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="756" dy="0">J07 · Дефект или новая предпосылка</tspan></text>
<text x="565" y="478" font-size="13" font-weight="600" text-anchor="middle" fill="#8a522b" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="565" dy="0">Вывод и границы затронутых результатов</tspan></text>
<text x="399" y="519" font-size="13" font-weight="600" text-anchor="middle" fill="#345260" paint-order="stroke fill" stroke="#fbfcfd" stroke-width="5" stroke-linejoin="round"><tspan x="399" dy="0">J06 · Наблюдения о попытке</tspan></text>
<text x="53" y="587" font-size="14" font-weight="510" text-anchor="start" fill="#4c6573"><tspan x="53" dy="0">A1 · HI — Human Interaction · CF — Context Formation · SF — System Formation</tspan><tspan x="53" dy="22">A2 · DMG — Dynamic Method Generation   |   A3 · EG — Execution Governance</tspan><tspan x="53" dy="22">A4 · WEC — Work Execution &amp; Continuation   |   A5 · RAF — Result Assurance &amp; Feedback</tspan><tspan x="53" dy="22">J08 · CF, SF, DMG, EG, WEC и RAF передают HI результат, варианты для выбора или точный пробел.</tspan><tspan x="53" dy="22">J09 · HI передаёт решение человека с его условиями и границами в SF, EG и WEC. CF и WEC используют сохранённые основания.</tspan><tspan x="53" dy="22">Журнал фиксирует фактическое применение FPF или MP и наблюдаемые исходы. MethodPack хранит способы для повторного использования.</tspan></text>
</g>
</svg>
