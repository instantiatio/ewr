site_name: Instantiatio / iEWR
repo_url: https://github.com/instantiatio/ewr
repo_name: instantiatio/ewr
edit_uri: ''
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: /ewr/assets/favicon-instantiatio-32.png
  palette:
    primary: white
    accent: indigo
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
markdown_extensions:
  - attr_list
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - /ewr/assets/site.css
extra_javascript:
  - /ewr/assets/site.js
hooks:
  - hooks.py
extra:
  alternate:
    - name: English
      link: /ewr/eng/
      lang: en
    - name: Русский
      link: /ewr/ru/
      lang: ru

# Retain the instruction source locally, exclude the retired page from the site.
exclude_docs: |
  /try/first-experiment/
